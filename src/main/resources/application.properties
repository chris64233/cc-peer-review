spring.application.name=cc-peer-review
spring.datasource.url=jdbc:h2:file:./data/cc-peer-review
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# 悲观锁等待（H2，毫秒）
spring.jpa.properties.jakarta.persistence.lock.timeout=5000
# 截止期规则：各评审轮次基础天数、未配置轮次的默认天数、单次延期上限
review.deadline.round-days[1]=21
review.deadline.round-days[2]=14
review.deadline.default-round-days=10
review.deadline.max-extension-days=14
